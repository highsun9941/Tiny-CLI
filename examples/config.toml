# Copy to ~/.config/tiny-cli/config.toml
# Or pass: tiny --config /path/to/config.toml
# Profile keys are selected with --provider or /use.
default_provider = "openrouter"

[plugins]
# Installed Python module:setup callables. Empty means the bare core.
enabled = []

[providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "openai/gpt-5"

[providers.openai]
name = "OpenAI"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model = "gpt-5"

# Native Anthropic Messages (set a model ID supported by your account):
# [providers.anthropic]
# name = "Anthropic"
# api_format = "anthropic"
# base_url = "https://api.anthropic.com/v1"
# api_key_env = "ANTHROPIC_API_KEY"
# model = "your-claude-model"
# max_tokens = 4096

# Example custom OpenAI-compatible provider:
# [providers.my-local-or-cloud-provider]
# name = "My Provider"
# base_url = "https://example.com/v1"
# api_key_env = "MY_PROVIDER_API_KEY"
# model = "my-model"

# A local server without authentication:
# [providers.local]
# name = "Local"
# base_url = "http://localhost:1234/v1"
# api_key_env = ""
# model = "your-local-model"
