[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiny-cli"
version = "0.2.0"
description = "A deliberately tiny, model-driven coding CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "textual>=0.89,<1",
]

[project.scripts]
tiny = "tiny_cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["tiny_cli"]
