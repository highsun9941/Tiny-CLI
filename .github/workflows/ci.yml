name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q tiny_cli
      - run: bash -n install.sh
      - run: pytest -q
      - run: python -m tiny_cli --help

  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and reinstall the current commit
        env:
          TINY_CLI_INSTALL_DIR: ${{ runner.temp }}/tiny-runtime
          TINY_CLI_BIN_DIR: ${{ runner.temp }}/tiny-bin
          TINY_CLI_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          # Exercise the uv bootstrap without tools installed by runner extras.
          PATH=/usr/bin:/bin:/usr/sbin:/sbin bash install.sh
          "$TINY_CLI_BIN_DIR/tiny" --help
          PATH=/usr/bin:/bin:/usr/sbin:/sbin bash install.sh
          "$TINY_CLI_BIN_DIR/tiny" --help
